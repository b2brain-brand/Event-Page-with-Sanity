<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event Page Template V2 — B2Brain — The Event Meeting Platform</title>
<meta name="description" content="Programmatic, modular event-page template for B2Brain. Every module is a variable; empty data hides its section so no page ever looks incomplete." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
================================================================================
  B2BRAIN · EVENT PAGE TEMPLATE V2.0  (programmatic SEO, fully modular)
  Built 2026-07-22. V1 lives alongside this file at preview.html (do not delete).
  Design: 100% compliant with context/04_design_system.skill.xml (brutalist).
--------------------------------------------------------------------------------
  HOW IT WORKS
  - The whole page renders from ONE data object (window.EVENTS[slug]).
    That object is the "backend feed" — in production it is a Webflow CMS item.
  - Every module is a VARIABLE with its own slot. If a field / array is empty,
    its element (or the whole section, and its TOC entry) is not rendered.
    -> Missing data never leaves an empty box. Sparse events still look complete.
  - The floating PREVIEW MODE bar (bottom-right, dev-only, never ships) switches
    between a data-RICH event and a data-SPARSE event so you can see the
    graceful degradation live.

  WEBFLOW MAPPING (each JS field -> a Webflow CMS field + native rule)
    identity.*        -> Plain Text / Date / Link fields, bound to hero elements
    stats[]           -> repeating "Stat" fields; hide cell if number empty
    tldr              -> Rich Text (short); hide block if empty
    gallery[]         -> Multi-image field or nested "Photo" collection list;
                         Collection List auto-hides when it has 0 items
    agenda.days[]     -> nested "Agenda Day" collection (tabs) + "Session" items
    speakers[]        -> nested "Speaker" collection list (auto-hides if empty)
    exhibitors.*      -> nested "Sponsor" collection + Plain Text notable list
    audience.*        -> Number/Plain Text; persona = nested collection
    cost.roi          -> Number defaults; calculator is one small script
    logistics.*       -> Plain Text + nested "Pass" / "Hotel" collections
    sentiment.*       -> nested "Video" / "Reddit" / "Testimonial" collections
    similar[]         -> Multi-Reference back into the Events collection
    faq[]             -> nested "FAQ" collection -> FAQPage JSON-LD
  In Webflow, "empty -> hidden" is the native Conditional Visibility setting on
  each element/collection-list. This mockup reproduces that behaviour in JS so
  you can preview it before it is built.

  NOTE: all sample copy/numbers below are ILLUSTRATIVE placeholders for design
  review. Real pages must use sourced event data (see meta.sources) and pass the
  citation-verifier before publishing.
================================================================================
-->

<style>
/* ============================================================ TOKENS */
:root{
  --font-heading:'Archivo',Arial,sans-serif;
  --font-body:'Inter',Arial,sans-serif;
  --black:#000; --white:#fff;
  --black-70:rgba(0,0,0,.7); --black-50:rgba(0,0,0,.5); --black-05:rgba(0,0,0,.05);
  --purple:#6c58ba; --purple-light:#e3e0f5;
  --orange:#ff382c; --orange-light:#ffe4de;
  --yellow:#ffeb46; --yellow-light:#fff8b8;
  --pink:#ff7cc0;
  --green:#89f86e; --green-badge:#e2fdd5; --green-light:#e7fde0; --ceramic:#12340c;
  --border-light:#f0f0f0; --whitesmoke:#f5f5f5; --cloudy-grey:#6b6b6b; --offwhite:#fafafa;
  --container:1160px; --container-lg:1344px; --margin:30px;
  --pad-xl:100px; --pad-3xl:160px;
  --nav-h:64px; --toc-h:56px;
  --radius:0;
}
/* ============================================================ RESET / BASE */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:24px;color:var(--black);background:var(--white);-webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4,h5{font-family:var(--font-heading);font-weight:500;margin:0;color:var(--black)}
h1{font-size:64px;line-height:72px;letter-spacing:-1.92px}
h2{font-size:56px;line-height:64px;letter-spacing:-1.68px}
h3{font-size:40px;line-height:48px;letter-spacing:-.8px}
h4{font-size:28px;line-height:36px;letter-spacing:-.4px}
h5{font-size:22px;line-height:30px}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 var(--margin)}
.container--lg{max-width:var(--container-lg)}
.eyebrow{font-family:var(--font-body);font-size:14px;font-weight:600;line-height:20px;letter-spacing:.56px;text-transform:uppercase;color:var(--black);display:inline-block}
.eyebrow--asterisk::before{content:'*';margin-right:3px}
.muted{color:var(--black-70)}
.mono-num{font-family:var(--font-heading);font-weight:500}

/* ============================================================ BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;font-size:16px;font-weight:500;line-height:24px;letter-spacing:-.32px;border:1px solid transparent;border-radius:0;cursor:pointer;transition:background .25s ease,color .25s ease,border-color .25s ease}
.btn--primary{background:var(--black);color:var(--white)}
.btn--primary:hover{background:var(--purple)}
.btn--ghost{background:transparent;color:var(--black);border:1px solid var(--black)}
.btn--ghost:hover{background:var(--black);color:var(--white)}
.btn--sm{padding:8px 18px;font-size:14px}
.link-underline{position:relative;font-weight:500;color:var(--black);display:inline-block}
.link-underline::after{content:'';position:absolute;left:0;bottom:-3px;width:0;height:1px;background:var(--black);transition:width .3s ease}
.link-underline:hover::after{width:100%}
.link-arrow::after{content:'\2192';margin-left:6px;display:inline-block;transition:transform .25s ease}
.link-arrow:hover::after{transform:translateX(4px)}

/* ============================================================ NAV */
.nav{position:sticky;top:0;z-index:80;background:var(--white);border-bottom:1px solid var(--black)}
.nav__inner{display:flex;align-items:center;justify-content:space-between;max-width:var(--container-lg);margin:0 auto;padding:12px var(--margin);height:var(--nav-h)}
.nav__logo{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-weight:600;font-size:19px;letter-spacing:-.4px}
.nav__logo-mark{width:22px;height:22px;background:var(--black);position:relative}
.nav__logo-mark::after{content:'';position:absolute;inset:6px;background:var(--orange)}
.nav__links{display:flex;gap:26px}
.nav__links a{font-size:14px;font-weight:500;color:var(--black-70)}
.nav__links a:hover{color:var(--black)}
.nav__cta{display:flex;align-items:center;gap:16px}
.nav__login{font-size:14px;font-weight:500}
@media(max-width:991px){.nav__links{display:none}}

/* ============================================================ TOC / SUBNAV */
.toc{position:sticky;top:var(--nav-h);z-index:70;background:var(--white);border-bottom:1px solid var(--black)}
.toc__inner{display:flex;align-items:center;gap:20px;max-width:var(--container-lg);margin:0 auto;padding:0 var(--margin);height:var(--toc-h)}
.toc__label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--black-50);white-space:nowrap}
.toc__links{display:flex;gap:22px;overflow-x:auto;flex:1;scrollbar-width:none}
.toc__links::-webkit-scrollbar{display:none}
.toc__links a{font-size:14px;font-weight:500;color:var(--black-70);white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.toc__links a:hover{color:var(--black)}
.toc__links a.is-active{color:var(--black);border-bottom-color:var(--orange)}
.toc .btn{white-space:nowrap}
@media(max-width:991px){.toc__label,.toc .btn{display:none}}

/* ============================================================ SECTION RHYTHM */
.sec{border-bottom:1px solid var(--black);padding:var(--pad-xl) 0}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec__head{max-width:720px;margin-bottom:44px}
.sec__head h2{margin-top:14px}
.sec__head p{margin-top:16px;font-size:18px;line-height:28px;color:var(--black-70)}
.sec__flag{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.sec__flag .sec__head{margin-bottom:0}

/* ============================================================ HERO */
.hero{border-bottom:1px solid var(--black);padding:56px 0 0;animation:heroIn .55s ease both}
.hero__grid{display:grid;grid-template-columns:1.35fr 1fr;gap:64px;align-items:start}
.hero__crumb{font-size:13px;color:var(--black-50);margin-bottom:22px}
.hero__crumb a:hover{color:var(--black)}
.hero__eyebrow{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--black);padding:5px 10px;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.chip--orange{background:var(--orange-light)}
.chip--green{background:var(--green-badge);color:var(--ceramic)}
.chip--purple{background:var(--purple-light)}
.chip--yellow{background:var(--yellow-light)}
.chip__dot{width:7px;height:7px;background:var(--orange)}
.hero h1{font-size:60px;line-height:66px;letter-spacing:-1.8px}
.hero__sub{margin-top:20px;font-size:19px;line-height:29px;color:var(--black-70);max-width:560px}
.hero__ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.hero__meta{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--black);margin:38px 0 0}
.hero__meta div{padding:16px 18px;border-right:1px solid var(--black)}
.hero__meta div:last-child{border-right:none}
.hero__meta dt{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--black-50)}
.hero__meta dd{margin:6px 0 0;font-family:var(--font-heading);font-size:18px;font-weight:500;letter-spacing:-.3px}
/* hero operator visual card */
.hero__visual{border:1px solid var(--black);background:var(--orange-light);padding:22px}
.hero__card{background:var(--white);border:1px solid var(--black);padding:20px}
.hero__card small{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--black-70)}
.hero__card-big{font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:28px;letter-spacing:-.4px;margin:10px 0 14px}
.hero__card-rows{border-top:1px solid var(--border-light)}
.hero__card-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-light);font-size:14px}
.hero__card-tag{font-size:12px;font-weight:600;padding:2px 8px;background:var(--green-badge);color:var(--ceramic)}
.hero__card-tag--orange{background:var(--orange-light);color:var(--orange)}
.hero__count{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--black-70)}
.hero__count b{font-family:var(--font-heading);font-size:15px}
.hero__pad{padding-bottom:64px}
@media(max-width:991px){.hero__grid{grid-template-columns:1fr;gap:36px}.hero h1{font-size:44px;line-height:50px;letter-spacing:-1.3px}.hero__meta{grid-template-columns:1fr}.hero__meta div{border-right:none;border-bottom:1px solid var(--black)}.hero__meta div:last-child{border-bottom:none}}

/* ============================================================ AT-A-GLANCE */
.glance{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--black)}
.glance__cell{padding:30px 26px;border-right:1px solid var(--black)}
.glance__cell:last-child{border-right:none}
.glance__num{font-family:var(--font-heading);font-weight:500;font-size:44px;line-height:1;letter-spacing:-1.2px}
.glance__label{margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.glance__meta{margin-top:6px;font-size:13px;color:var(--black-70)}
@media(max-width:991px){.glance{grid-template-columns:repeat(2,1fr)}.glance__cell:nth-child(2){border-right:none}.glance__cell:nth-child(1),.glance__cell:nth-child(2){border-bottom:1px solid var(--black)}}
@media(max-width:640px){.glance{grid-template-columns:1fr}.glance__cell{border-right:none;border-bottom:1px solid var(--black)}.glance__cell:last-child{border-bottom:none}}

/* ============================================================ ANSWER / TLDR */
.answer{border:1px solid var(--black);background:var(--purple-light);padding:44px 48px}
.answer h2{font-size:30px;line-height:38px;letter-spacing:-.5px;max-width:900px}
.answer p{margin-top:16px;font-size:18px;line-height:29px;max-width:820px}
@media(max-width:640px){.answer{padding:30px 24px}}

/* ============================================================ GALLERY SLIDER */
.slider{position:relative;border:1px solid var(--black);overflow:hidden}
.slider__track{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.slide{min-width:100%;position:relative;aspect-ratio:16/8}
.slide__ph{position:absolute;inset:0;background:var(--whitesmoke);display:flex;align-items:center;justify-content:center}
.slide__ph span{font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--black-50)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide__cap{position:absolute;left:0;bottom:0;background:var(--white);border-top:1px solid var(--black);border-right:1px solid var(--black);padding:10px 16px;font-size:13px;font-weight:500;max-width:75%}
.slide__idx{position:absolute;right:0;top:0;background:var(--black);color:var(--white);font-family:var(--font-heading);font-size:13px;padding:6px 12px}
.slider__nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.slider__btn{pointer-events:auto;width:46px;height:46px;background:var(--white);border:1px solid var(--black);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:background .2s,color .2s}
.slider__btn:hover{background:var(--black);color:var(--white)}
.slider__btn--prev{border-left:none}
.slider__btn--next{border-right:none}
.slider__dots{display:flex;gap:8px;justify-content:center;padding:16px;border-top:1px solid var(--black)}
.slider__dot{width:9px;height:9px;background:var(--white);border:1px solid var(--black);cursor:pointer;padding:0}
.slider__dot.is-active{background:var(--black)}
.gallery__foot{margin-top:14px;font-size:13px;color:var(--black-50)}

/* ============================================================ WHY / PULLQUOTE */
.why__grid{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:start}
.why__body p{font-size:17px;line-height:28px;color:var(--black-70)}
.why__body p+p{margin-top:16px}
.pullquote{border:1px solid var(--black);border-left:4px solid var(--purple);padding:28px 30px;background:var(--white)}
.pullquote__text{font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:31px;letter-spacing:-.4px}
.pullquote__attr{margin-top:16px;font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--black-70)}
@media(max-width:991px){.why__grid{grid-template-columns:1fr;gap:32px}}

/* ============================================================ TABS (agenda) */
.tabs{display:flex;border:1px solid var(--black);border-bottom:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:14px 22px;font-size:14px;font-weight:500;border-right:1px solid var(--black);background:var(--white);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.tab:last-child{border-right:none}
.tab.is-active{background:var(--black);color:var(--white)}
.tab.is-active .tab__meta{color:rgba(255,255,255,.6)}
.tab__meta{display:block;font-size:11px;color:var(--black-50);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.agenda__panel{border:1px solid var(--black);display:none}
.agenda__panel.is-active{display:block}
.agenda__row{display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border-light)}
.agenda__row:last-child{border-bottom:none}
.agenda__time{font-family:var(--font-heading);font-weight:500;font-size:15px}
.agenda__title{font-weight:500}
.agenda__loc{font-size:13px;color:var(--black-70);margin-top:3px}
.agenda__track{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--black);white-space:nowrap}
.tracks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.tracks span{font-size:13px;font-weight:500;border:1px solid var(--black);padding:6px 12px}
@media(max-width:640px){.agenda__row{grid-template-columns:1fr;gap:6px}.agenda__track{justify-self:start}}

/* ============================================================ SPEAKERS */
.speakers{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--black)}
.speaker{padding:24px;border-right:1px solid var(--black);border-bottom:1px solid var(--black)}
.speaker__av{width:52px;height:52px;background:var(--purple-light);border:1px solid var(--black);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:600;font-size:18px;margin-bottom:16px}
.speaker__name{font-family:var(--font-heading);font-weight:500;font-size:18px;letter-spacing:-.3px}
.speaker__role{margin-top:6px;font-size:13px;color:var(--black-70);line-height:19px}
.speaker__key{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;background:var(--purple-light);color:var(--purple);padding:3px 8px}
@media(max-width:991px){.speakers{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.speakers{grid-template-columns:1fr}.speaker{border-right:none}}

/* ============================================================ EXHIBITORS */
.exh__tiers{display:flex;flex-direction:column;border:1px solid var(--black)}
.exh__tier{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid var(--black)}
.exh__tier:last-child{border-bottom:none}
.exh__tier-name{padding:20px 22px;border-right:1px solid var(--black);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;background:var(--whitesmoke)}
.exh__logos{display:flex;flex-wrap:wrap}
.exh__logo{flex:0 0 auto;min-width:150px;padding:18px 22px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);font-family:var(--font-heading);font-weight:500;font-size:15px;color:var(--black-70)}
.exh__notable{margin-top:26px;border:1px solid var(--black);border-left:4px solid var(--orange);padding:22px 24px}
.exh__notable h4{font-size:15px;letter-spacing:-.2px;margin-bottom:10px}
.exh__notable p{font-size:15px;line-height:24px;color:var(--black-70)}
@media(max-width:640px){.exh__tier{grid-template-columns:1fr}.exh__tier-name{border-right:none;border-bottom:1px solid var(--black)}}

/* ============================================================ AUDIENCE */
.aud__grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--black)}
.aud__col{padding:32px}
.aud__col:first-child{border-right:1px solid var(--black)}
.aud__bar{margin-bottom:16px}
.aud__bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.aud__bar-top b{font-family:var(--font-heading);font-weight:500}
.aud__bar-track{height:10px;background:var(--whitesmoke);border:1px solid var(--black)}
.aud__bar-fill{height:100%;background:var(--purple)}
.aud__chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.aud__chips span{font-size:13px;border:1px solid var(--black);padding:5px 11px}
.aud__match{margin-top:26px;background:var(--purple-light);border:1px solid var(--black);padding:24px 26px}
.aud__match h4{font-size:16px;margin-bottom:8px}
.aud__match p{font-size:15px;line-height:24px}
@media(max-width:640px){.aud__grid{grid-template-columns:1fr}.aud__col:first-child{border-right:none;border-bottom:1px solid var(--black)}}

/* ============================================================ ROI CALC */
.roi{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--black)}
.roi__inputs{padding:34px;border-right:1px solid var(--black)}
.roi__field{margin-bottom:18px}
.roi__field label{display:block;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:7px}
.roi__field input{width:100%;border:1px solid var(--black);border-radius:0;padding:11px 13px;font-family:var(--font-body);font-size:15px;background:var(--white)}
.roi__field input:focus{outline:2px solid var(--purple);outline-offset:-2px}
.roi__row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.roi__out{padding:34px;background:var(--purple-light);display:flex;flex-direction:column;justify-content:center}
.roi__out-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
.roi__stat-num{font-family:var(--font-heading);font-weight:500;font-size:40px;line-height:1;letter-spacing:-1px}
.roi__stat-label{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--black-70)}
.roi__pipeline{border-top:1px solid var(--black);padding-top:22px}
.roi__pipeline .roi__stat-num{font-size:52px}
.roi__ltm{margin-top:18px;font-size:13px;color:var(--black-70);line-height:19px}
.roi__ltm b{color:var(--black)}
@media(max-width:640px){.roi{grid-template-columns:1fr}.roi__inputs{border-right:none;border-bottom:1px solid var(--black)}}

/* ============================================================ LOGISTICS */
.log__grid{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--black)}
.log__cell{padding:28px 30px;border-right:1px solid var(--black);border-bottom:1px solid var(--black)}
.log__cell h4{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.log__cell h4::before{content:'';width:9px;height:9px;background:var(--yellow)}

/* =====================================================================
   2. HELPERS + graceful-degradation guards
   ===================================================================== */
var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
var has=function(v){ if(v==null) return false; if(Array.isArray(v)) return v.length>0; if(typeof v==="string") return v.trim().length>0; if(typeof v==="object") return Object.keys(v).length>0; return true; };
var money=function(n){ if(n>=1e6) return "$"+(n/1e6).toFixed(n>=1e7?0:1)+"M"; if(n>=1e3) return "$"+Math.round(n/1e3)+"K"; return "$"+Math.round(n); };
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtRange(s,e){ var a=new Date(s+"T00:00:00"),b=new Date(e+"T00:00:00"); if(isNaN(a)) return ""; var sameMonth=a.getMonth()===b.getMonth(); var d1=MONTHS[a.getMonth()]+" "+a.getDate(); var d2=(sameMonth?"":MONTHS[b.getMonth()]+" ")+b.getDate(); return d1+"–"+d2+", "+b.getFullYear(); }
function countdown(s){ var now=new Date(); var start=new Date(s+"T00:00:00"); var diff=Math.ceil((start-now)/(1000*60*60*24)); if(isNaN(diff)) return ""; if(diff<0) return "Past event · recap"; if(diff===0) return "Happening today"; if(diff<14) return diff+" days to go"; return Math.round(diff/7)+" weeks to go"; }

/* wrap a section only if it produced inner HTML */
function sec(id,cls,inner){ return has(inner)? '<section id="'+id+'" class="sec '+cls+'"><div class="container">'+inner+'</div></section>' : ''; }
function head(eyebrow,title,sub){ return '<div class="sec__head"><span class="eyebrow eyebrow--asterisk">'+esc(eyebrow)+'</span>'+(has(title)?'<h2>'+esc(title)+'</h2>':'')+(has(sub)?'<p>'+esc(sub)+'</p>':'')+'</div>'; }

function mHero(e){

  var meta='';

  if(has(i.startDate)) metaPairs.push(["Dates",fmtRange(i.startDate,i.endDate)]);
  if(has(i.venue)||has(i.city)) metaPairs.push(["Location",[i.venue,i.city].filter(has).join(" · ")]);

  /* right column: operator visual card (only if provided) */
  var visual='';

    var rows=(c.rows||[]).map(function(r){ var tagCls=r[2]==='booked'?'':(r[2]==='fast'?' hero__card-tag--orange':''); var tag=r[2]?'<span class="hero__card-tag'+tagCls+'">'+esc(r[1])+'</span>':'<b class="mono-num">'+esc(r[1])+'</b>'; return '<div class="hero__card-row"><span>'+esc(r[0])+'</span>'+tag+'</div>'; }).join('');
    visual='<div class="hero__visual"><div class="hero__card"><small>* '+esc(c.label)+'</small><div class="hero__card-big">'+esc(c.big)+'</div><div class="hero__card-rows">'+rows+'</div></div>'+(cd?'<div class="hero__count">'+ '<span class="chip chip--orange" style="border:none;padding:0;background:none"><span class="chip__dot"></span></span> <b class="mono-num">'+esc(cd.toUpperCase())+'</b> — pages are refreshed as the agenda is confirmed.</div>':'')+'</div>';
  }

    +'<div class="hero__eyebrow">'+eyebrow+'</div>'

function renderEvent(slug){
  var e=window.EVENTS[slug]; if(!e) return;
  var built=MODULES.map(function(m){ return {id:m.id, nav:m.nav, html:m.fn(e)}; }).filter(function(m){ return has(m.html); });
  document.getElementById('root').innerHTML = built.map(function(m){return m.html;}).join('');
  /* TOC only lists sections that actually rendered AND have a label */
  var toc=built.filter(function(m){return m.nav;}).map(function(m){return '<a href="#'+m.id+'" data-spy="'+m.id+'">'+esc(m.nav)+'</a>';}).join('');
  document.getElementById('tocLinks').innerHTML=toc;
  document.title=(e.identity&&e.identity.name?e.identity.name:'Event')+' — B2Brain — The Event Meeting Platform';
  wireInteractions();
  revealSections();
}

/* =====================================================================
   5. INTERACTIONS (slider, tabs, FAQ, ROI calc, scrollspy, reveal)
   ===================================================================== */
function wireInteractions(){
  /* --- gallery slider --- */
  var track=document.getElementById('galleryTrack');
  if(track){
    var idx=0, n=track.children.length;
    var go=function(i){ idx=(i+n)%n; track.style.transform='translateX(-'+(idx*100)+'%)'; document.querySelectorAll('.slider__dot').forEach(function(d,k){d.classList.toggle('is-active',k===idx);}); };
    document.querySelectorAll('[data-slide]').forEach(function(b){b.addEventListener('click',function(){go(idx+(b.dataset.slide==='next'?1:-1));});});
    document.querySelectorAll('[data-dot]').forEach(function(d){d.addEventListener('click',function(){go(+d.dataset.dot);});});
  }
  /* --- agenda tabs --- */
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('is-active');});
    document.querySelectorAll('.agenda__panel').forEach(function(x){x.classList.remove('is-active');});
    t.classList.add('is-active'); var p=document.getElementById(t.dataset.tab); if(p)p.classList.add('is-active');
  });});
  /* --- FAQ accordion --- */
  document.querySelectorAll('.faq__q').forEach(function(q){q.addEventListener('click',function(){
    var item=q.closest('.faq__item'), a=item.querySelector('.faq__a'), open=item.classList.toggle('is-open');
    q.setAttribute('aria-expanded',open); a.style.maxHeight=open?a.scrollHeight+'px':0;
  });});
  /* --- ROI calculator --- */
  var calc=document.getElementById('roiCalc');
  if(calc){
    var ids=['roiSpend','roiReps','roiDays','roiConvos','roiQual','roiMeet','roiAcv'];
    var val=function(id){return parseFloat(document.getElementById(id).value)||0;};
    var run=function(){
      var spend=val('roiSpend'),reps=val('roiReps'),days=val('roiDays'),cpr=val('roiConvos'),qr=val('roiQual')/100,mr=val('roiMeet')/100,acv=val('roiAcv');
      var convos=reps*days*cpr, qualified=convos*qr, meetings=qualified*mr, pipeline=meetings*acv, mult=spend>0?pipeline/spend:0;
      document.getElementById('roiQualOut').textContent=Math.round(qualified);
      document.getElementById('roiMeetOut').textContent=Math.round(meetings);
      document.getElementById('roiPipeOut').textContent=money(pipeline);
      document.getElementById('roiMult').textContent=(mult).toFixed(1)+'x';
      document.getElementById('roiLtm').textContent=Math.round(mr*100)+'%';
    };
    ids.forEach(function(id){document.getElementById(id).addEventListener('input',run);}); run();
  }
}

/* --- scroll-reveal + TOC scrollspy via IntersectionObserver --- */
var _spy;
/* Content is ALWAYS visible — no scroll-dependent hiding, so no blank frames can
   ever occur (a fragile scroll-reveal was removed). The only observer is the TOC
   scrollspy, which highlights the active section but never hides content. */
function revealSections(){
  if(_spy)_spy.disconnect();
  _spy=new IntersectionObserver(function(en){en.forEach(function(x){ if(x.isIntersecting){ var id=x.target.id; document.querySelectorAll('.toc__links a').forEach(function(a){a.classList.toggle('is-active',a.dataset.spy===id);}); } });},{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('main section[id]').forEach(function(s){_spy.observe(s);});
}

  document.querySelectorAll('.demobar__opt').forEach(function(x){x.classList.remove('is-active');});
  b.classList.add('is-active'); window.scrollTo(0,0); renderEvent(b.dataset.slug);
});});
document.getElementById('demoMin').addEventListener('click',function(){document.getElementById('demobar').classList.toggle('min');this.textContent=document.getElementById('demobar').classList.contains('min')?'+':'–';});

/* smooth-scroll offset for sticky nav+toc */
document.addEventListener('click',function(ev){var a=ev.target.closest('a[href^="#"]');if(!a)return;var id=a.getAttribute('href').slice(1);var el=document.getElementById(id);if(el){ev.preventDefault();var y=el.getBoundingClientRect().top+window.pageYOffset-(64+56+12);window.scrollTo({top:y,behavior:'smooth'});}});

/* boot */
renderEvent('dreamforce-2026');
