<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B2Brain AI assistant</title>
    <style>
      html,
      body,
      #did-agent-container {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="did-agent-container"></div>
    <script
      type="module"
      src="https://agent.d-id.com/v2/index.js"
      data-mode="fabio"
      data-client-key="ck_qPIyvgzFHQIuoiKeb8zC9"
      data-agent-id="v2_agt_H4O1YDpP"
      data-name="did-agent"
      data-orientation="horizontal"
      data-monitor="true"
      data-position="right"
      data-open-mode="compact"
      data-track="true"
    ></script>
    <script>
      (function () {
        var shouldOpen = false;
        var parentOrigin = 'https://www.b2brain.com';
        var allowedParentOrigins = [
          'https://www.b2brain.com',
          'https://b2brain.com',
          'https://project-pcxmd.vercel.app',
          'http://localhost:3005'
        ];
        var openTimer = null;
        var lastOpenClick = 0;

        function openAgent(shadowRoot) {
          var fabio = shadowRoot && shadowRoot.querySelector('.didagent__fabio');
          if (!fabio) return false;
          if (fabio.getAttribute('data-enabled') === 'true') return true;
          if (fabio.getAttribute('data-enabled') !== 'false') return false;
          if (Date.now() - lastOpenClick < 750) return false;
          var toggle = fabio.querySelector(':scope > button');
          if (!toggle) return false;
          toggle.click();
          lastOpenClick = Date.now();
          return false;
        }

        function requestOpen() {
          shouldOpen = true;
          if (openTimer) window.clearInterval(openTimer);
          var openTries = 0;
          openTimer = window.setInterval(function () {
            var host = document.querySelector('[data-testid="didagent_root"]');
            var shadowRoot = host && host.shadowRoot;
            if (openAgent(shadowRoot)) {
              window.parent.postMessage({ type: 'b2brain-did-ready' }, parentOrigin);
              window.clearInterval(openTimer);
              openTimer = null;
            } else if (++openTries > 200) {
              window.clearInterval(openTimer);
              openTimer = null;
            }
          }, 100);
        }

        window.addEventListener('message', function (event) {
          if (allowedParentOrigins.indexOf(event.origin) === -1) return;
          if (!event.data || event.data.type !== 'b2brain-did-open') return;
          parentOrigin = event.origin;
          lastOpenClick = 0;
          requestOpen();
        });

        var tries = 0;
        var timer = window.setInterval(function () {
          var host = document.querySelector('[data-testid="didagent_root"]');
          var shadowRoot = host && host.shadowRoot;
          if (shadowRoot) {
            shadowRoot.addEventListener('click', function (event) {
              var path = event.composedPath ? event.composedPath() : [];
              var close = path.some(function (node) {
                return node && node.getAttribute && node.getAttribute('aria-label') === 'Close';
              });
              if (close) {
                window.parent.postMessage({ type: 'b2brain-did-close' }, parentOrigin);
              }
            });
            window.clearInterval(timer);
          } else if (++tries > 80) {
            window.clearInterval(timer);
          }
        }, 250);
      })();
    </script>
  </body>
</html>
